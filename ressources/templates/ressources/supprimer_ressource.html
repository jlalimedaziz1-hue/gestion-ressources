<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer ressource</title>
</head>
<body>

    <h1>Confirmation de suppression</h1>

    <p>
        Voulez-vous vraiment supprimer :
        <strong>{{ ressource.titre }}</strong> ?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirmer la suppression</button>
    </form>

    <a href="{% url 'liste_ressources' %}">Annuler</a>

</body>
</html>
